<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverso Explorer</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    safelist: ['absolute', 'top-2', 'right-2', 'text-rose-600', 'text-slate-500', 'grid', 'size-10', 'place-items-center'],
  }
</script>
</head>
<body class="min-h-dvh bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
  <!--
    PASO 05 · La vista de Favoritos (resultado final)
    Qué cambia: Los enlaces Personajes y Favoritos del header llevan data-vista y el h1 un id. app.js suma el estado vista; render() pinta la lista de la vista actual, cambia el título y marca el enlace activo.
    Compruébalo: Clic en Favoritos: solo tus marcados, título "Tus personajes favoritos" y sin "Cargar más". Quita todos: aparece el mensaje de vacío. Con la URL de la API bloqueada (Block request URL) y recarga, la vista Favoritos sigue funcionando.
  -->
  <header class="sticky top-0 z-10 bg-white shadow dark:bg-slate-900 dark:shadow-slate-950">
    <nav class="relative mx-auto flex max-w-6xl items-center justify-between p-4">
      <a href="#" class="text-xl font-bold text-indigo-600 dark:text-indigo-400">
        Multiverso<span class="text-slate-900 dark:text-white">Explorer</span>
      </a>

      <button id="btn-menu" type="button"
              class="rounded-lg p-2 text-2xl hover:bg-slate-100 md:hidden dark:hover:bg-slate-800"
              aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">☰</button>

      <ul id="menu"
          class="absolute top-full right-0 left-0 hidden flex-col gap-1 bg-white p-4 shadow-lg
                 md:static md:flex md:flex-row md:gap-6 md:bg-transparent md:p-0 md:shadow-none
                 dark:bg-slate-900">
        <!-- data-vista: los enlaces que cambian la vista. app.js les cambia las clases y aria-current -->
        <li><a href="#" data-vista="todos" aria-current="page" class="block rounded-lg px-3 py-2 font-medium text-indigo-600 md:p-0 dark:text-indigo-400">Personajes</a></li>
        <li><a href="#" class="block rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 md:p-0 md:hover:bg-transparent dark:text-slate-300 dark:hover:bg-slate-800">Episodios</a></li>
        <li><a href="#" data-vista="favoritos" class="block rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 md:p-0 md:hover:bg-transparent dark:text-slate-300 dark:hover:bg-slate-800">Favoritos</a></li>
      </ul>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl p-4">
    <h1 id="titulo" class="mt-4 text-3xl font-bold md:text-4xl">Personajes de Rick and Morty</h1>
    <p id="contador" class="mt-1 text-slate-500 dark:text-slate-400"></p>

    <form id="form-busqueda" class="my-6 flex flex-col gap-3 md:flex-row" role="search">
      <label for="busqueda" class="sr-only">Buscar personaje</label>
      <input id="busqueda" type="search" placeholder="Buscar por nombre…" minlength="2"
             class="flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2
                   focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none
                   user-invalid:border-rose-500
                   dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-indigo-900">
      <label for="filtro-estado" class="sr-only">Filtrar por estado</label>
      <select id="filtro-estado"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2
                   focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none
                   dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-indigo-900">
        <option value="">Todos los estados</option>
        <option value="alive">Vivos</option>
        <option value="dead">Muertos</option>
        <option value="unknown">Desconocido</option>
      </select>
      <button type="submit"
              class="rounded-lg bg-indigo-600 px-5 py-2 font-semibold text-white transition
                     hover:bg-indigo-700 active:scale-95">
        Buscar
      </button>
    </form>

    <h2 class="mt-6 mb-3 text-sm font-semibold tracking-wide text-slate-500 uppercase dark:text-slate-400">Resultados</h2>
    <section id="grilla" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      <!-- Vacía a propósito: las tarjetas las escribe render() a partir del array personajes -->
    </section>

    <!-- Paginación: hidden hasta que render() sepa si la API tiene otra página (info.next) -->
    <div class="mt-8 text-center">
      <button id="btn-mas" type="button" hidden
              class="rounded-lg border border-slate-300 bg-white px-6 py-2 font-semibold transition
                     hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50
                     dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700">
        Cargar más
      </button>
    </div>
  </main>

  <footer class="mt-12 border-t border-slate-200 py-6 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">
    Datos: <a href="https://rickandmortyapi.com" class="underline hover:text-indigo-600">The Rick and Morty API</a> · Hecho con Tailwind CSS v4
  </footer>

  <dialog id="modal-detalle" aria-labelledby="modal-nombre"
          class="m-auto w-full max-w-md overflow-hidden rounded-2xl bg-white p-0 shadow-2xl
                 backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm
                 dark:bg-slate-800 dark:text-slate-100">
    <img id="modal-img" src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" alt="Rick Sanchez" class="aspect-square w-full object-cover">
    <div class="space-y-4 p-6">
      <h2 id="modal-nombre" class="text-2xl font-bold text-slate-900 dark:text-white">Rick Sanchez</h2>
      <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
        <dt class="text-slate-500 dark:text-slate-400">Estado</dt> <dd id="modal-estado" class="font-medium">Vivo</dd>
        <dt class="text-slate-500 dark:text-slate-400">Especie</dt> <dd id="modal-especie" class="font-medium">Human</dd>
        <dt class="text-slate-500 dark:text-slate-400">Origen</dt> <dd id="modal-origen" class="font-medium">Earth (C-137)</dd>
        <dt class="text-slate-500 dark:text-slate-400">Ubicación</dt> <dd id="modal-ubicacion" class="font-medium">Citadel of Ricks</dd>
      </dl>
      <form method="dialog">
        <button class="w-full rounded-lg border border-slate-300 py-2 font-semibold
                       hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">
          Cerrar
        </button>
      </form>
    </div>
  </dialog>

  <!-- Un solo script: app.js. Él importa a los demás. type="module" exige abrir con Live Server -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
